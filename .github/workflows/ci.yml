name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile atcn_wifi_core.py wifi_app.py test_wifi_flow.py
      - name: Test captive portal flow
        run: python test_wifi_flow.py
      - name: Headless GUI smoke test
        run: python wifi_app.py --smoke-test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint and build Android beta
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintBeta assembleBeta assembleDebugAndroidTest --no-daemon --no-parallel
      - uses: actions/upload-artifact@v4
        with:
          name: ATCN-Wifi-Android-beta-CI
          path: android/app/build/outputs/apk/beta/app-beta.apk
          if-no-files-found: error
